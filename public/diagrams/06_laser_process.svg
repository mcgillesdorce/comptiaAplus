<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%">
    <rect width="800" height="480" fill="#FAFAFA" rx="6" />
    <text x="400" y="36" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3864" text-anchor="middle">Laser Printer Imaging Process — 7 Steps</text>
    <rect x="50" y="80" width="160" height="110" fill="#5B9BD5" stroke="#222" stroke-width="1.5" rx="6" /><circle cx="70" cy="100" r="14" fill="#FFF" stroke="#222" stroke-width="1.5" /><text x="70" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#5B9BD5" text-anchor="middle">1</text><text x="130" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">Processing</text><text x="130" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Data received</text><text x="130" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">& rasterized</text><line x1="212" y1="135" x2="232" y2="135" stroke="#222" stroke-width="2" /><polygon points="232,131 238,135 232,139" fill="#222" /><rect x="240" y="80" width="160" height="110" fill="#70AD47" stroke="#222" stroke-width="1.5" rx="6" /><circle cx="260" cy="100" r="14" fill="#FFF" stroke="#222" stroke-width="1.5" /><text x="260" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#70AD47" text-anchor="middle">2</text><text x="320" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">Charging</text><text x="320" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Drum charged to</text><text x="320" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">-600V uniformly</text><line x1="402" y1="135" x2="422" y2="135" stroke="#222" stroke-width="2" /><polygon points="422,131 428,135 422,139" fill="#222" /><rect x="430" y="80" width="160" height="110" fill="#ED7D31" stroke="#222" stroke-width="1.5" rx="6" /><circle cx="450" cy="100" r="14" fill="#FFF" stroke="#222" stroke-width="1.5" /><text x="450" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#ED7D31" text-anchor="middle">3</text><text x="510" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">Exposing</text><text x="510" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Laser writes image,</text><text x="510" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">neutralizes charge</text><line x1="592" y1="135" x2="612" y2="135" stroke="#222" stroke-width="2" /><polygon points="612,131 618,135 612,139" fill="#222" /><rect x="620" y="80" width="160" height="110" fill="#A5A5A5" stroke="#222" stroke-width="1.5" rx="6" /><circle cx="640" cy="100" r="14" fill="#FFF" stroke="#222" stroke-width="1.5" /><text x="640" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#A5A5A5" text-anchor="middle">4</text><text x="700" y="135" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">Developing</text><text x="700" y="158" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Toner sticks to</text><text x="700" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">exposed drum areas</text><line x1="700" y1="192" x2="700" y2="232" stroke="#222" stroke-width="2" /><polygon points="696,232 700,238 704,232" fill="#222" /><rect x="50" y="240" width="160" height="110" fill="#FFC000" stroke="#222" stroke-width="1.5" rx="6" /><circle cx="70" cy="260" r="14" fill="#FFF" stroke="#222" stroke-width="1.5" /><text x="70" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#FFC000" text-anchor="middle">5</text><text x="130" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">Transferring</text><text x="130" y="318" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Toner moves from</text><text x="130" y="332" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">drum onto paper</text><line x1="212" y1="295" x2="232" y2="295" stroke="#222" stroke-width="2" /><polygon points="232,291 238,295 232,299" fill="#222" /><rect x="240" y="240" width="160" height="110" fill="#C0504D" stroke="#222" stroke-width="1.5" rx="6" /><circle cx="260" cy="260" r="14" fill="#FFF" stroke="#222" stroke-width="1.5" /><text x="260" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#C0504D" text-anchor="middle">6</text><text x="320" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">Fusing</text><text x="320" y="318" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Heat + pressure</text><text x="320" y="332" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">melts toner to paper</text><line x1="402" y1="295" x2="422" y2="295" stroke="#222" stroke-width="2" /><polygon points="422,291 428,295 422,299" fill="#222" /><rect x="430" y="240" width="160" height="110" fill="#8064A2" stroke="#222" stroke-width="1.5" rx="6" /><circle cx="450" cy="260" r="14" fill="#FFF" stroke="#222" stroke-width="1.5" /><text x="450" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#8064A2" text-anchor="middle">7</text><text x="510" y="295" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#FFF" text-anchor="middle">Cleaning</text><text x="510" y="318" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">Drum reset for</text><text x="510" y="332" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#FFF" text-anchor="middle">next page</text><text x="400" y="420" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#FF3B30" text-anchor="middle">↻ After Cleaning, cycle repeats from Processing for the next page</text><text x="400" y="450" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#1F3864" text-anchor="middle" font-style="italic">Memory aid: "Please Charge Every Day To Finish Cleaning"</text>
  </svg>