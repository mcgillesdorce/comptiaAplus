    <text x="400" y="32" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#1F3864" text-anchor="middle">Ethernet Wiring Standards — T-568A vs T-568B</text>
    <rect x="80" y="100" width="240" height="40" fill="#DDD" stroke="#333" stroke-width="2" rx="4" /><rect x="92" y="104" width="14" height="16" fill="#FFF" stroke="#333" /><rect x="92" y="104" width="14" height="8" fill="#FFF" /><rect x="92" y="112" width="14" height="8" fill="#3CB44B" /><rect x="92" y="104" width="14" height="16" fill="none" stroke="#333" /><text x="99" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#333" text-anchor="middle">1</text><rect x="120" y="104" width="14" height="16" fill="#3CB44B" stroke="#333" /><rect x="120" y="104" width="14" height="16" fill="#3CB44B" /><rect x="120" y="104" width="14" height="16" fill="none" stroke="#333" /><text x="127" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#333" text-anchor="middle">2</text><rect x="148" y="104" width="14" height="16" fill="#FFF" stroke="#333" /><rect x="148" y="104" width="14" height="8" fill="#FFF" /><rect x="148" y="112" width="14" height="8" fill="#F58231" /><rect x="148" y="104" width="14" height="16" fill="none" stroke="#333" /><text x="155" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#333" text-anchor="middle">3</text><rect x="176" y="104" width="14" height="16" fill="#4363D8" stroke="#333" /><rect x="176" y="104" width="14" height="16" fill="#4363D8" /><rect x="176" y="104" width="14" height="16" fill="none" stroke="#333" /><text x="183" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#333" text-anchor="middle">4</text><rect x="204" y="104" width="14" height="16" fill="#FFF" stroke="#333" /><rect x="204" y="104" width="14" height="8" fill="#FFF" /><rect x="204" y="112" width="14" height="8" fill="#4363D8" /><rect x="204" y="104" width="14" height="16" fill="none" stroke="#333" /><text x="211" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#333" text-anchor="middle">5</text><rect x="232" y="104" width="14" height="16" fill="#F58231" stroke="#333" /><rect x="232" y="104" width="14" height="16" fill="#F58231" /><rect x="232" y="104" width="14" height="16" fill="none" stroke="#333" /><text x="239" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#333" text-anchor="middle">6</text><rect x="260" y="104" width="14" height="16" fill="#FFF" stroke="#333" /><rect x="260" y="104" width="14" height="8" fill="#FFF" /><rect x="260" y="112" width="14" height="8" fill="#9A6324" /><rect x="260" y="104" width="14" height="16" fill="none" stroke="#333" /><text x="267" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#333" text-anchor="middle">7</text><rect x="288" y="104" width="14" height="16" fill="#9A6324" stroke="#333" /><rect x="288" y="104" width="14" height="16" fill="#9A6324" /><rect x="288" y="104" width="14" height="16" fill="none" stroke="#333" /><text x="295" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#333" text-anchor="middle">8</text><text x="200" y="88" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1F3864" text-anchor="middle">T-568A</text><rect x="80" y="240" width="240" height="40" fill="#DDD" stroke="#333" stroke-width="2" rx="4" /><rect x="92" y="244" width="14" height="16" fill="#FFF" stroke="#333" /><rect x="92" y="244" width="14" height="8" fill="#FFF" /><rect x="92" y="252" width="14" height="8" fill="#F58231" /><rect x="92" y="244" width="14" height="16" fill="none" stroke="#333" /><text x="99" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#333" text-anchor="middle">1</text><rect x="120" y="244" width="14" height="16" fill="#F58231" stroke="#333" /><rect x="120" y="244" width="14" height="16" fill="#F58231" /><rect x="120" y="244" width="14" height="16" fill="none" stroke="#333" /><text x="127" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#333" text-anchor="middle">2</text><rect x="148" y="244" width="14" height="16" fill="#FFF" stroke="#333" /><rect x="148" y="244" width="14" height="8" fill="#FFF" /><rect x="148" y="252" width="14" height="8" fill="#3CB44B" /><rect x="148" y="244" width="14" height="16" fill="none" stroke="#333" /><text x="155" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#333" text-anchor="middle">3</text><rect x="176" y="244" width="14" height="16" fill="#4363D8" stroke="#333" /><rect x="176" y="244" width="14" height="16" fill="#4363D8" /><rect x="176" y="244" width="14" height="16" fill="none" stroke="#333" /><text x="183" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#333" text-anchor="middle">4</text><rect x="204" y="244" width="14" height="16" fill="#FFF" stroke="#333" /><rect x="204" y="244" width="14" height="8" fill="#FFF" /><rect x="204" y="252" width="14" height="8" fill="#4363D8" /><rect x="204" y="244" width="14" height="16" fill="none" stroke="#333" /><text x="211" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#333" text-anchor="middle">5</text><rect x="232" y="244" width="14" height="16" fill="#3CB44B" stroke="#333" /><rect x="232" y="244" width="14" height="16" fill="#3CB44B" /><rect x="232" y="244" width="14" height="16" fill="none" stroke="#333" /><text x="239" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#333" text-anchor="middle">6</text><rect x="260" y="244" width="14" height="16" fill="#FFF" stroke="#333" /><rect x="260" y="244" width="14" height="8" fill="#FFF" /><rect x="260" y="252" width="14" height="8" fill="#9A6324" /><rect x="260" y="244" width="14" height="16" fill="none" stroke="#333" /><text x="267" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#333" text-anchor="middle">7</text><rect x="288" y="244" width="14" height="16" fill="#9A6324" stroke="#333" /><rect x="288" y="244" width="14" height="16" fill="#9A6324" /><rect x="288" y="244" width="14" height="16" fill="none" stroke="#333" /><text x="295" y="292" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#333" text-anchor="middle">8</text><text x="200" y="228" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1F3864" text-anchor="middle">T-568B</text><rect x="400" y="100" width="340" height="200" fill="#FFF8E0" stroke="#1F3864" rx="4" /><text x="420" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1F3864">Differences:</text><text x="420" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#333">• Only pins 1, 2, 3, 6 differ</text><text x="420" y="180" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#333">• Green and Orange pairs are</text><text x="420" y="197" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#333">  swapped between A and B</text><text x="420" y="225" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#333">• Both ends same standard =</text><text x="420" y="242" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#333">  straight-through cable</text><text x="420" y="265" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#333">• A on one end, B on other =</text><text x="420" y="282" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#FF3B30">  crossover cable</text>
    <text x="400" y="365" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#666" text-anchor="middle" font-style="italic">T-568B is the modern standard for office and data center installations</text>
  </svg>