<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
    <defs>
      <linearGradient id="pcbGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#10663D" />
        <stop offset="100%" stop-color="#0E4D2E" />
      </linearGradient>
      <pattern id="solderMask" patternUnits="userSpaceOnUse" width="20" height="20">
        <rect width="20" height="20" fill="#0E4D2E" />
        <circle cx="10" cy="10" r="0.5" fill="#073017" opacity="0.4" />
      </pattern>
    </defs>

    <!-- PCB -->
    <rect x="20" y="20" width="760" height="560" fill="url(#pcbGrad)" rx="6" />
    <rect x="20" y="20" width="760" height="560" fill="url(#solderMask)" rx="6" opacity="0.5" />

    <!-- Mounting holes -->
    <circle cx="40" cy="40" r="6" fill="#222" stroke="#555" stroke-width="1.5" />
       <circle cx="40" cy="40" r="3" fill="#0E4D2E" /><circle cx="760" cy="40" r="6" fill="#222" stroke="#555" stroke-width="1.5" />
       <circle cx="760" cy="40" r="3" fill="#0E4D2E" /><circle cx="40" cy="560" r="6" fill="#222" stroke="#555" stroke-width="1.5" />
       <circle cx="40" cy="560" r="3" fill="#0E4D2E" /><circle cx="760" cy="560" r="6" fill="#222" stroke="#555" stroke-width="1.5" />
       <circle cx="760" cy="560" r="3" fill="#0E4D2E" /><circle cx="400" cy="40" r="6" fill="#222" stroke="#555" stroke-width="1.5" />
       <circle cx="400" cy="40" r="3" fill="#0E4D2E" /><circle cx="400" cy="560" r="6" fill="#222" stroke="#555" stroke-width="1.5" />
       <circle cx="400" cy="560" r="3" fill="#0E4D2E" />

    <!-- CPU Socket -->
    <rect x="280" y="180" width="140" height="140" fill="#1a1a1a" rx="4" />
    <rect x="290" y="190" width="120" height="120" fill="#333" rx="2" />
    <rect x="300" y="200" width="100" height="100" fill="#444" rx="1" />
    <!-- Socket lever -->
    <rect x="270" y="195" width="14" height="110" fill="#666" rx="2" />
    <text x="350" y="255" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">CPU SOCKET</text>

    <!-- 4-pin CPU Power (EPS) — top, near CPU -->
    <rect x="320" y="100" width="60" height="30" fill="#F5F5F5" stroke="#333" rx="2" />
    <rect x="325" y="105" width="9" height="20" fill="#444" rx="1" /><rect x="339" y="105" width="9" height="20" fill="#444" rx="1" /><rect x="353" y="105" width="9" height="20" fill="#444" rx="1" /><rect x="367" y="105" width="9" height="20" fill="#444" rx="1" />
    <text x="350" y="148" font-family="'Segoe UI', Arial, sans-serif" font-size="9" fill="#FFF" text-anchor="middle">EPS 4+4 pin</text>

    <!-- DIMM slots — right of CPU -->
    
        <rect x="460" y="160" width="14" height="180" fill="#1F3864" rx="1" />
        <rect x="462" y="162" width="10" height="176" fill="#0E1E3D" rx="1" />
        <rect x="458" y="155" width="18" height="6" fill="#FFF" />
        <rect x="458" y="340" width="18" height="6" fill="#FFF" />
      
        <rect x="482" y="160" width="14" height="180" fill="#1F3864" rx="1" />
        <rect x="484" y="162" width="10" height="176" fill="#0E1E3D" rx="1" />
        <rect x="480" y="155" width="18" height="6" fill="#FFF" />
        <rect x="480" y="340" width="18" height="6" fill="#FFF" />
      
        <rect x="504" y="160" width="14" height="180" fill="#1F3864" rx="1" />
        <rect x="506" y="162" width="10" height="176" fill="#0E1E3D" rx="1" />
        <rect x="502" y="155" width="18" height="6" fill="#FFF" />
        <rect x="502" y="340" width="18" height="6" fill="#FFF" />
      
        <rect x="526" y="160" width="14" height="180" fill="#1F3864" rx="1" />
        <rect x="528" y="162" width="10" height="176" fill="#0E1E3D" rx="1" />
        <rect x="524" y="155" width="18" height="6" fill="#FFF" />
        <rect x="524" y="340" width="18" height="6" fill="#FFF" />
      
    <text x="503" y="358" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">DIMM SLOTS (RAM)</text>

    <!-- 24-pin ATX Mainboard Power — right edge -->
    <rect x="700" y="180" width="60" height="200" fill="#F5F5F5" stroke="#333" stroke-width="1" rx="3" />
    <rect x="706" y="185" width="18" height="12" fill="#444" rx="1" /><rect x="730" y="185" width="18" height="12" fill="#444" rx="1" /><rect x="706" y="201" width="18" height="12" fill="#444" rx="1" /><rect x="730" y="201" width="18" height="12" fill="#444" rx="1" /><rect x="706" y="217" width="18" height="12" fill="#444" rx="1" /><rect x="730" y="217" width="18" height="12" fill="#444" rx="1" /><rect x="706" y="233" width="18" height="12" fill="#444" rx="1" /><rect x="730" y="233" width="18" height="12" fill="#444" rx="1" /><rect x="706" y="249" width="18" height="12" fill="#444" rx="1" /><rect x="730" y="249" width="18" height="12" fill="#444" rx="1" /><rect x="706" y="265" width="18" height="12" fill="#444" rx="1" /><rect x="730" y="265" width="18" height="12" fill="#444" rx="1" /><rect x="706" y="281" width="18" height="12" fill="#444" rx="1" /><rect x="730" y="281" width="18" height="12" fill="#444" rx="1" /><rect x="706" y="297" width="18" height="12" fill="#444" rx="1" /><rect x="730" y="297" width="18" height="12" fill="#444" rx="1" /><rect x="706" y="313" width="18" height="12" fill="#444" rx="1" /><rect x="730" y="313" width="18" height="12" fill="#444" rx="1" /><rect x="706" y="329" width="18" height="12" fill="#444" rx="1" /><rect x="730" y="329" width="18" height="12" fill="#444" rx="1" /><rect x="706" y="345" width="18" height="12" fill="#444" rx="1" /><rect x="730" y="345" width="18" height="12" fill="#444" rx="1" /><rect x="706" y="361" width="18" height="12" fill="#444" rx="1" /><rect x="730" y="361" width="18" height="12" fill="#444" rx="1" />
    <text x="730" y="395" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">24-pin ATX</text>

    <!-- PCIe x16 (long blue slot) -->
    <rect x="60" y="380" width="320" height="14" fill="#1F3864" rx="2" />
    <rect x="64" y="383" width="312" height="8" fill="#0E1E3D" rx="1" />
    <text x="220" y="408" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="700" fill="#FFF" text-anchor="middle">PCIe x16 (GPU)</text>

    <!-- PCIe x8 -->
    <rect x="60" y="430" width="170" height="14" fill="#222" rx="2" />
    <text x="145" y="458" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">PCIe x8</text>

    <!-- PCIe x4 -->
    <rect x="60" y="475" width="90" height="14" fill="#222" rx="2" />
    <text x="105" y="503" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">PCIe x4</text>

    <!-- PCIe x1 -->
    <rect x="60" y="515" width="35" height="14" fill="#222" rx="2" />
    <text x="78" y="543" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">x1</text>

    <!-- SATA ports — bottom right -->
    <g transform="translate(550, 450)">
         <rect x="0" y="0" width="20" height="14" fill="#E89E1B" rx="2" />
         <rect x="3" y="2" width="14" height="10" fill="#222" rx="1" />
         <rect x="0" y="14" width="20" height="6" fill="#E89E1B" rx="1" />
       </g><g transform="translate(574, 450)">
         <rect x="0" y="0" width="20" height="14" fill="#E89E1B" rx="2" />
         <rect x="3" y="2" width="14" height="10" fill="#222" rx="1" />
         <rect x="0" y="14" width="20" height="6" fill="#E89E1B" rx="1" />
       </g><g transform="translate(598, 450)">
         <rect x="0" y="0" width="20" height="14" fill="#E89E1B" rx="2" />
         <rect x="3" y="2" width="14" height="10" fill="#222" rx="1" />
         <rect x="0" y="14" width="20" height="6" fill="#E89E1B" rx="1" />
       </g><g transform="translate(622, 450)">
         <rect x="0" y="0" width="20" height="14" fill="#E89E1B" rx="2" />
         <rect x="3" y="2" width="14" height="10" fill="#222" rx="1" />
         <rect x="0" y="14" width="20" height="6" fill="#E89E1B" rx="1" />
       </g><g transform="translate(646, 450)">
         <rect x="0" y="0" width="20" height="14" fill="#E89E1B" rx="2" />
         <rect x="3" y="2" width="14" height="10" fill="#222" rx="1" />
         <rect x="0" y="14" width="20" height="6" fill="#E89E1B" rx="1" />
       </g><g transform="translate(670, 450)">
         <rect x="0" y="0" width="20" height="14" fill="#E89E1B" rx="2" />
         <rect x="3" y="2" width="14" height="10" fill="#222" rx="1" />
         <rect x="0" y="14" width="20" height="6" fill="#E89E1B" rx="1" />
       </g>
    <text x="620" y="488" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">SATA ports</text>

    <!-- M.2 slot -->
    <rect x="280" y="350" width="160" height="10" fill="#5A2D8F" rx="2" />
    <circle cx="445" cy="355" r="4" fill="#AAA" />
    <text x="360" y="345" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">M.2 NVMe slot</text>

    <!-- CMOS battery -->
    <circle cx="600" cy="540" r="22" fill="#C0C0C0" stroke="#888" stroke-width="2" />
    <circle cx="600" cy="540" r="16" fill="#D8D8D8" />
    <text x="600" y="544" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="#666" text-anchor="middle">CR2032</text>
    <text x="600" y="575" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">CMOS battery</text>

    <!-- I/O shield area (top edge) -->
    <rect x="60" y="60" width="200" height="60" fill="#1a1a1a" stroke="#444" />
    <rect x="70" y="70" width="40" height="20" fill="#444" rx="2" />
    <rect x="120" y="70" width="40" height="20" fill="#888" rx="2" />
    <rect x="170" y="70" width="40" height="20" fill="#0066CC" rx="2" />
    <rect x="70" y="95" width="40" height="20" fill="#0066CC" rx="2" />
    <rect x="120" y="95" width="40" height="20" fill="#FF6600" rx="2" />
    <text x="160" y="138" font-family="'Segoe UI', Arial, sans-serif" font-size="10" font-weight="700" fill="#FFF" text-anchor="middle">I/O panel (USB, ethernet, audio)</text>

    <!-- Chipset heatsink -->
    <rect x="490" y="430" width="60" height="60" fill="#888" stroke="#444" rx="3" />
    <line x1="490" y1="438" x2="550" y2="438" stroke="#555" stroke-width="1" /><line x1="490" y1="450" x2="550" y2="450" stroke="#555" stroke-width="1" /><line x1="490" y1="462" x2="550" y2="462" stroke="#555" stroke-width="1" /><line x1="490" y1="474" x2="550" y2="474" stroke="#555" stroke-width="1" /><line x1="490" y1="486" x2="550" y2="486" stroke="#555" stroke-width="1" />
    <text x="520" y="510" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">Chipset</text>

    <!-- Front panel header -->
    <rect x="660" y="510" width="50" height="20" fill="#FFD700" rx="1" />
    <circle cx="668" cy="516" r="1.5" fill="#222" /><circle cx="668" cy="524" r="1.5" fill="#222" /><circle cx="677" cy="516" r="1.5" fill="#222" /><circle cx="677" cy="524" r="1.5" fill="#222" /><circle cx="686" cy="516" r="1.5" fill="#222" /><circle cx="686" cy="524" r="1.5" fill="#222" /><circle cx="695" cy="516" r="1.5" fill="#222" /><circle cx="695" cy="524" r="1.5" fill="#222" /><circle cx="704" cy="516" r="1.5" fill="#222" /><circle cx="704" cy="524" r="1.5" fill="#222" />
    <text x="685" y="548" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="700" fill="#FFF" text-anchor="middle">Front panel</text>

    <!-- VRM heatsinks near CPU -->
    <rect x="280" y="140" width="140" height="30" fill="#555" stroke="#333" rx="2" />
    <line x1="290" y1="142" x2="290" y2="168" stroke="#888" stroke-width="2" /><line x1="308" y1="142" x2="308" y2="168" stroke="#888" stroke-width="2" /><line x1="326" y1="142" x2="326" y2="168" stroke="#888" stroke-width="2" /><line x1="344" y1="142" x2="344" y2="168" stroke="#888" stroke-width="2" /><line x1="362" y1="142" x2="362" y2="168" stroke="#888" stroke-width="2" /><line x1="380" y1="142" x2="380" y2="168" stroke="#888" stroke-width="2" /><line x1="398" y1="142" x2="398" y2="168" stroke="#888" stroke-width="2" />

    <!-- Title -->
    <text x="400" y="592" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1F3864" text-anchor="middle">ATX Motherboard — Component Map</text>
  </svg>