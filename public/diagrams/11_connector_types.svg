  <rect x="510" y="276" width="80" height="52" rx="3" fill="#CC8844" stroke="#8B6F47" stroke-width="1.5"/>
  <rect x="515" y="281" width="70" height="42" rx="2" fill="#E8C88A"/>
  <rect x="543" y="268" width="14" height="10" rx="2" fill="#8B6F47"/>
  <circle cx="550" cy="273" r="3.5" fill="#FAFAFA" stroke="#555" stroke-width="1"/>
  <path d="M520,328 L520,340 L580,340 L580,328" fill="none" stroke="#8B6F47" stroke-width="2.5"/>
  <text x="550" y="362" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1F3864" text-anchor="middle">RJ-style clip latch</text>
  <text x="550" y="377" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Half size of SC</text>
  <text x="550" y="392" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Most popular data center</text>
  <text x="550" y="446" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#C0392B" text-anchor="middle" font-style="italic">"Little Connector"</text>

  <!-- SC Fiber -->
