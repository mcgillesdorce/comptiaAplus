  <text x="712" y="375" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Large square body</text>
  <text x="712" y="390" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Subscriber Connector</text>
  <text x="712" y="446" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#C0392B" text-anchor="middle" font-style="italic">"Square Connector"</text>

  <text x="400" y="478" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#666" text-anchor="middle" font-style="italic">HDMI = trapezoid | DisplayPort = notched corner | VGA = 15-pin D-sub | USB-C = reversible oval | LC = half SC size</text>
</svg>
