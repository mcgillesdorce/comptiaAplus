  <circle cx="383" cy="316" r="3" fill="#CCC"/>
  <circle cx="396" cy="316" r="3" fill="#CCC"/>
  <circle cx="409" cy="316" r="3" fill="#CCC"/>
  <circle cx="422" cy="316" r="3" fill="#CCC"/>
  <circle cx="435" cy="316" r="3" fill="#CCC"/>
  <circle cx="448" cy="316" r="3" fill="#CCC"/>
  <circle cx="328" cy="301" r="6" fill="#AAA" stroke="#777" stroke-width="1"/>
  <circle cx="460" cy="301" r="6" fill="#AAA" stroke="#777" stroke-width="1"/>
  <text x="394" y="348" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1F3864" text-anchor="middle">15-pin D-sub (3 rows)</text>
  <text x="394" y="363" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Analog video only</text>
  <text x="394" y="378" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Legacy monitors</text>
  <text x="394" y="446" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#C0392B" text-anchor="middle" font-style="italic">"No audio -- video only"</text>

  <!-- LC Fiber -->
