  <text x="712" y="54" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1F3864" text-anchor="middle">USB-C</text>
  <rect x="662" y="78" width="100" height="48" rx="24" fill="#555" stroke="#333" stroke-width="1.5"/>
  <rect x="667" y="83" width="90" height="38" rx="19" fill="#444"/>
  <rect x="672" y="88" width="80" height="28" rx="14" fill="#EEE"/>
  <rect x="680" y="93" width="10" height="18" fill="#DAA520" rx="1"/>
  <rect x="695" y="93" width="10" height="18" fill="#DAA520" rx="1"/>
  <rect x="720" y="93" width="10" height="18" fill="#DAA520" rx="1"/>
  <rect x="735" y="93" width="10" height="18" fill="#DAA520" rx="1"/>
  <text x="712" y="152" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1F3864" text-anchor="middle">Oval / Reversible</text>
  <text x="712" y="167" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">USB 3.1 / 3.2 / 4</text>
  <text x="712" y="182" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Thunderbolt 3/4</text>
  <text x="712" y="225" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#C0392B" text-anchor="middle" font-style="italic">"Reversible plug"</text>

  <!-- ===== ROW 2 ===== -->

