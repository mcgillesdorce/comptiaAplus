<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" width="800" height="490">
  <rect width="800" height="490" fill="#FAFAFA" rx="6"/>
  <text x="400" y="26" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="700" fill="#1F3864" text-anchor="middle">Common Connector Types -- Visual Identification</text>

  <!-- ===== ROW 1 ===== -->

  <!-- RJ45 -->
  <rect x="8" y="36" width="148" height="200" rx="5" fill="#EBF5FF" stroke="#1A73CC" stroke-width="1.5"/>
  <text x="82" y="54" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1F3864" text-anchor="middle">RJ45 (8P8C)</text>
  <rect x="28" y="62" width="108" height="72" rx="3" fill="#CCC" stroke="#888" stroke-width="1.5"/>
  <rect x="32" y="66" width="100" height="40" fill="#AAA"/>
  <rect x="36" y="67" width="10" height="28" fill="#555" rx="1"/>
  <rect x="49" y="67" width="10" height="28" fill="#555" rx="1"/>
  <rect x="62" y="67" width="10" height="28" fill="#555" rx="1"/>
  <rect x="75" y="67" width="10" height="28" fill="#555" rx="1"/>
  <rect x="88" y="67" width="10" height="28" fill="#555" rx="1"/>
  <rect x="101" y="67" width="10" height="28" fill="#555" rx="1"/>
  <rect x="114" y="67" width="10" height="28" fill="#555" rx="1"/>
  <rect x="127" y="67" width="10" height="28" fill="#555" rx="1"/>
  <rect x="65" y="56" width="34" height="8" rx="2" fill="#BBB" stroke="#888" stroke-width="1"/>
  <text x="82" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1F3864" text-anchor="middle">8 contacts</text>
  <text x="82" y="173" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Ethernet (Cat5/5e/6/6A)</text>
  <text x="82" y="188" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Larger than RJ11</text>
  <text x="82" y="225" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#C0392B" text-anchor="middle" font-style="italic">"8 pins = network"</text>

  <!-- RJ11 -->
  <rect x="164" y="36" width="148" height="200" rx="5" fill="#FFF8E0" stroke="#D4A017" stroke-width="1.5"/>
  <text x="238" y="54" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1F3864" text-anchor="middle">RJ11 (6P4C)</text>
  <rect x="184" y="62" width="108" height="72" rx="3" fill="#CCC" stroke="#888" stroke-width="1.5"/>
  <rect x="188" y="66" width="100" height="40" fill="#AAA"/>
  <rect x="195" y="67" width="11" height="28" fill="#DDD" rx="1" stroke="#999"/>
  <rect x="210" y="67" width="11" height="28" fill="#555" rx="1"/>
  <rect x="225" y="67" width="11" height="28" fill="#555" rx="1"/>
  <rect x="240" y="67" width="11" height="28" fill="#555" rx="1"/>
  <rect x="255" y="67" width="11" height="28" fill="#555" rx="1"/>
  <rect x="270" y="67" width="11" height="28" fill="#DDD" rx="1" stroke="#999"/>
  <rect x="221" y="56" width="34" height="8" rx="2" fill="#BBB" stroke="#888" stroke-width="1"/>
  <text x="238" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1F3864" text-anchor="middle">4 active contacts</text>
  <text x="238" y="173" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Telephone / modem</text>
  <text x="238" y="188" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Smaller than RJ45</text>
  <text x="238" y="225" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#C0392B" text-anchor="middle" font-style="italic">"4 pins = phone"</text>

  <!-- BNC -->
  <rect x="320" y="36" width="148" height="200" rx="5" fill="#EAFAF1" stroke="#1E8449" stroke-width="1.5"/>
  <text x="394" y="54" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1F3864" text-anchor="middle">BNC</text>
  <circle cx="394" cy="108" r="38" fill="#CCC" stroke="#888" stroke-width="2"/>
  <circle cx="394" cy="108" r="27" fill="#999" stroke="#666" stroke-width="1.5"/>
  <rect x="353" y="101" width="9" height="14" rx="2" fill="#777"/>
  <rect x="432" y="101" width="9" height="14" rx="2" fill="#777"/>
  <circle cx="394" cy="108" r="8" fill="#FFD700" stroke="#B8860B" stroke-width="1.5"/>
