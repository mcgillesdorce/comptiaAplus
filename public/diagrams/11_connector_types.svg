  <rect x="8" y="248" width="148" height="210" rx="5" fill="#EBF5FF" stroke="#1A73CC" stroke-width="1.5"/>
  <text x="82" y="266" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1F3864" text-anchor="middle">HDMI</text>
  <polygon points="20,276 144,276 138,320 26,320" fill="#555" stroke="#333" stroke-width="1.5"/>
  <polygon points="24,280 140,280 135,317 29,317" fill="#333"/>
  <line x1="32" y1="283" x2="32" y2="313" stroke="#CCC" stroke-width="1.5"/>
  <line x1="41" y1="283" x2="41" y2="313" stroke="#CCC" stroke-width="1.5"/>
