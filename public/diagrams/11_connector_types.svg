  <line x1="104" y1="283" x2="104" y2="313" stroke="#CCC" stroke-width="1.5"/>
  <line x1="113" y1="283" x2="113" y2="313" stroke="#CCC" stroke-width="1.5"/>
  <line x1="122" y1="283" x2="121" y2="313" stroke="#CCC" stroke-width="1.5"/>
  <text x="82" y="342" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1F3864" text-anchor="middle">19-pin trapezoid</text>
  <text x="82" y="357" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Audio + Video</text>
  <text x="82" y="372" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">TVs, monitors</text>
  <text x="82" y="446" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#C0392B" text-anchor="middle" font-style="italic">"Trapezoidal body"</text>

