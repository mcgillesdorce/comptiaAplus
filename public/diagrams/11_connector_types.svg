  <line x1="236" y1="283" x2="236" y2="313" stroke="#CCC" stroke-width="1.5"/>
  <line x1="246" y1="283" x2="246" y2="313" stroke="#CCC" stroke-width="1.5"/>
  <line x1="256" y1="283" x2="256" y2="313" stroke="#CCC" stroke-width="1.5"/>
  <line x1="266" y1="283" x2="265" y2="310" stroke="#CCC" stroke-width="1.5"/>
  <line x1="276" y1="283" x2="274" y2="306" stroke="#CCC" stroke-width="1.5"/>
  <text x="238" y="342" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1F3864" text-anchor="middle">Notched corner</text>
  <text x="238" y="357" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Audio + Video</text>
  <text x="238" y="372" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Daisy-chain monitors</text>
  <text x="238" y="446" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#C0392B" text-anchor="middle" font-style="italic">"One notched corner"</text>

  <!-- VGA DB-15 -->
  <rect x="320" y="248" width="148" height="210" rx="5" fill="#FFF8E0" stroke="#D4A017" stroke-width="1.5"/>
