  <text x="394" y="180" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Coaxial / 10BASE-2</text>
  <text x="394" y="195" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Video surveillance</text>
  <text x="394" y="225" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#C0392B" text-anchor="middle" font-style="italic">"Quarter-turn lock"</text>

  <!-- F-Type -->
  <rect x="476" y="36" width="148" height="200" rx="5" fill="#F5EEF8" stroke="#7D3C98" stroke-width="1.5"/>
  <text x="550" y="54" font-family="'Segoe UI',Arial,sans-serif" font-size="12" font-weight="700" fill="#1F3864" text-anchor="middle">F-Type</text>
  <circle cx="550" cy="105" r="36" fill="#C0C0C0" stroke="#888" stroke-width="2"/>
  <circle cx="550" cy="105" r="26" fill="#999" stroke="#777" stroke-width="1.5"/>
  <circle cx="550" cy="105" r="30" fill="none" stroke="#AAA" stroke-width="3" stroke-dasharray="5,3"/>
  <circle cx="550" cy="105" r="7" fill="#FFD700" stroke="#B8860B" stroke-width="1.5"/>
  <line x1="550" y1="98" x2="550" y2="112" stroke="#555" stroke-width="2.5"/>
  <text x="550" y="162" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" fill="#1F3864" text-anchor="middle">Threaded barrel</text>
  <text x="550" y="177" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#555" text-anchor="middle">Cable TV / DOCSIS</text>
