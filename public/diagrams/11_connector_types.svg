  <circle cx="448" cy="289" r="3" fill="#CCC"/>
  <circle cx="344" cy="302" r="3" fill="#CCC"/>
  <circle cx="358" cy="302" r="3" fill="#CCC"/>
  <circle cx="372" cy="302" r="3" fill="#CCC"/>
  <circle cx="386" cy="302" r="3" fill="#CCC"/>
