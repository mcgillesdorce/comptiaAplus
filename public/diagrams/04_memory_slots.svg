"244.8" y="105" width="3" height="5" fill="#FFD700" /><rect x="251" y="105" width="3" height="5" fill="#FFD700" /><rect x="257.20000000000005" y="105" width="3" height="5" fill="#FFD700" /><rect x="263.4" y="105" width="3" height="5" fill="#FFD700" /><rect x="269.6" y="105" width="3" height="5" fill="#FFD700" /><rect x="275.8" y="105" width="3" height="5" fill="#FFD700" /><rect x="282" y="105" width="3" height="5" fill="#FFD700" /><rect x="288.20000000000005" y="105" width="3" height="5" fill="#FFD700" /><rect x="294.4" y="105" width="3" height="5" fill="#FFD700" /><rect x="300.6" y="105" width="3" height="5" fill="#FFD700" /><rect x="306.8" y="105" width="3" height="5" fill="#FFD700" /><rect x="313" y="105" width="3" height="5" fill="#FFD700" /><rect x="319.20000000000005" y="105" width="3" height="5" fill="#FFD700" /><rect x="325.40000000000003" y="105" width="3" height="5" fill="#FFD700" /><rect x="331.6" y="105" width="3" height="5" fill="#FFD700" /><rect x="337.8" y="105" width="3" height="5" fill="#FFD700" /><rect x="344" y="105" width="3" height="5" fill="#FFD700" /><rect x="350.2" y="105" width="3" height="5" fill="#FFD700" /><rect x="356.40000000000003" y="105" width="3" height="5" fill="#FFD700" /><rect x="362.6" y="105" width="3" height="5" fill="#FFD700" /><rect x="368.8" y="105" width="3" height="5" fill="#FFD700" /><rect x="375" y="105" width="3" height="5" fill="#FFD700" /><rect x="381.2" y="105" width="3" height="5" fill="#FFD700" /><rect x="387.40000000000003" y="105" width="3" height="5" fill="#FFD700" /><rect x="393.6" y="105" width="3" height="5" fill="#FFD700" /><rect x="399.8" y="105" width="3" height="5" fill="#FFD700" /><rect x="406" y="105" width="3" height="5" fill="#FFD700" /><rect x="412.2" y="105" width="3" height="5" fill="#FFD700" /><rect x="418.40000000000003" y="105" width="3" height="5" fill="#FFD700" /><rect x="424.6" y="105" width="3" height="5" fill="#FFD700" /><rect x="430.8" y="105" width="3" height="5" fill="#FFD700" /><rect x="64" y="104" width="372" height="2" fill="#FFD700" /><text x="250" y="68" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1F3864" text-anchor="middle">DIMM (Desktop) — DDR4: 288 pins</text><text x="250" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">~5.25 inches long — used in towers and servers</text><rect x="60" y="230" width="190" height="30" fill="#0E4D2E" stroke="#222" rx="2" /><rect x="170" y="252" width="12" height="8" fill="#FAFAFA" /><rect x="65" y="255" width="3" height="5" fill="#FFD700" /><rect x="71.2" y="255" width="3" height="5" fill="#FFD700" /><rect x="77.4" y="255" width="3" height="5" fill="#FFD700" /><rect x="83.6" y="255" width="3" height="5" fill="#FFD700" /><rect x="89.8" y="255" width="3" height="5" fill="#FFD700" /><rect x="96" y="255" width="3" height="5" fill="#FFD700" /><rect x="102.2" y="255" width="3" height="5" fill="#FFD700" /><rect x="108.4" y="255" width="3" height="5" fill="#FFD700" /><rect x="114.6" y="255" width="3" height="5" fill="#FFD700" /><rect x="120.80000000000001" y="255" width="3" height="5" fill="#FFD700" /><rect x="127" y="255" width="3" height="5" fill="#FFD700" /><rect x="133.2" y="255" width="3" height="5" fill="#FFD700" /><rect x="139.4" y="255" width="3" height="5" fill="#FFD700" /><rect x="145.60000000000002" y="255" width="3" height="5" fill="#FFD700" /><rect x="151.8" y="255" width="3" height="5" fill="#FFD700" /><rect x="158" y="255" width="3" height="5" fill="#FFD700" /><rect x="164.2" y="255" width="3" height="5" fill="#FFD700" /><rect x="170.4" y="255" width="3" height="5" fill="#FFD700" /><rect x="176.60000000000002" y="255" width="3" height="5" fill="#FFD700" /><rect x="182.8" y="255" width="3" height="5" fill="#FFD700" /><rect x="189" y="255" width="3" height="5" fill="#FFD700" /><rect x="195.20000000000002" y="255" width="3" height="5" fill="#FFD700" /><rect x="201.4" y="255" width="3" height="5" fill="#FFD700" /><rect x="207.6" y="255" width="3" height="5" fill="#FFD700" /><rect x="213.8" y="255" width="3" height="5" fill="#FFD700" /><rect x="220" y="255" width="3" height="5" fill="#FFD700" /><rect x="226.20000000000002" y="255" width="3" height="5" fill="#FFD700" /><rect x="232.4" y="255" width="3" height="5" fill="#FFD700" /><rect x="238.6" y="255" width="3" height="5" fill="#FFD700" /><rect x="244.8" y="255" width="3" height="5" fill="#FFD700" /><rect x="64" y="254" width="184" height="2" fill="#FFD700" /><text x="155" y="218" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1F3864" text-anchor="middle">SODIMM (Laptop) — DDR4: 260 pins</text><text x="155" y="290" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#333" text-anchor="middle">~2.66 inches — laptops, NUCs, SFF PCs</text><line x1="500" y1="80" x2="500" y2="290" stroke="#888" stroke-width="1" stroke-dasharray="4,3" /><rect x="520" y="100" width="240" height="200" fill="#FFF8E0" stroke="#1F3864" rx="4" /><text x="540" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1F3864">Quick ID:</text><text x="540" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#333">• Long stick = DIMM (desktop)</text><text x="540" y="180" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#333">• Short stick = SODIMM (laptop)</text><text x="540" y="210" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#333">• Notch position differs by DDR</text><text x="540" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#333">  generation — prevents wrong</text><text x="540" y="248" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#333">  install of DDR3 vs DDR4 vs DDR5</text><text x="540" y="280" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#FF3B30">Never interchangeable!</text>
  </svg>