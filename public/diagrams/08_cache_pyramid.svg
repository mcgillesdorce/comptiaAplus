<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
    <rect width="800" height="480" fill="#FAFAFA" rx="6" />
    <text x="400" y="40" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1F3864" text-anchor="middle">Memory Hierarchy — Closer to CPU = Faster but Smaller</text>
    <rect x="290" y="70" width="220" height="42" fill="#C0392B" stroke="#222" stroke-width="1.5" rx="3" /><text x="400" y="88" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFF" text-anchor="middle">CPU Registers</text><text x="400" y="104" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">Bytes  •  ~1 cycle</text><rect x="270" y="120" width="260" height="42" fill="#E67E22" stroke="#222" stroke-width="1.5" rx="3" /><text x="400" y="138" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFF" text-anchor="middle">L1 Cache</text><text x="400" y="154" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">32-128 KB/core  •  2-4 cycles</text><rect x="245" y="170" width="310" height="42" fill="#F39C12" stroke="#222" stroke-width="1.5" rx="3" /><text x="400" y="188" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFF" text-anchor="middle">L2 Cache</text><text x="400" y="204" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">256 KB - 1 MB  •  10-12 cycles</text><rect x="210" y="220" width="380" height="42" fill="#27AE60" stroke="#222" stroke-width="1.5" rx="3" /><text x="400" y="238" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFF" text-anchor="middle">L3 Cache (shared)</text><text x="400" y="254" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">4-128 MB  •  30-50 cycles</text><rect x="170" y="270" width="460" height="42" fill="#2980B9" stroke="#222" stroke-width="1.5" rx="3" /><text x="400" y="288" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFF" text-anchor="middle">System RAM (DIMM)</text><text x="400" y="304" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">8-128 GB  •  200-300 cycles</text><rect x="130" y="320" width="540" height="42" fill="#8E44AD" stroke="#222" stroke-width="1.5" rx="3" /><text x="400" y="338" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFF" text-anchor="middle">SSD</text><text x="400" y="354" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">TB  •  ~100,000 cycles</text><rect x="90" y="370" width="620" height="42" fill="#34495E" stroke="#222" stroke-width="1.5" rx="3" /><text x="400" y="388" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#FFF" text-anchor="middle">HDD</text><text x="400" y="404" font-family="'Segoe UI', Arial, sans-serif" font-size="10" fill="#FFF" text-anchor="middle">TB  •  ~10,000,000 cycles</text><line x1="40" y1="75" x2="40" y2="405" stroke="#222" stroke-width="2" /><polygon points="36,75 40,67 44,75" fill="#222" /><polygon points="36,405 40,413 44,405" fill="#222" /><text x="20" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#222" transform="rotate(-90 20 100)">Fastest</text><text x="20" y="390" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#222" transform="rotate(-90 20 390)">Slowest</text><line x1="760" y1="75" x2="760" y2="405" stroke="#222" stroke-width="2" /><polygon points="756,75 760,67 764,75" fill="#222" /><polygon points="756,405 760,413 764,405" fill="#222" /><text x="780" y="100" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#222" transform="rotate(90 780 100)">Smallest</text><text x="780" y="390" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="600" fill="#222" transform="rotate(90 780 390)">Largest</text>
    <text x="400" y="465" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-style="italic" fill="#FF3B30" text-anchor="middle">L1 is the smallest and fastest cache, located ON the CPU core</text>
  </svg>